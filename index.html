    <title>טיול משפחתי לארה״ב 2026</title>

    <!-- Home screen install. manifest.json does the real work on Android: icon, an app
         drawer entry and a standalone window with no address bar. iOS Safari ignores most
         of it and uses the apple-* metas above plus this touch icon. -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #f3f4f6;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollers: momentum on iOS, and never bubble a scroll to the page */
        .app-scroll {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Marker Circle Styling - sized for a fingertip, not a mouse pointer */
        .custom-marker {
            background-color: #3b82f6;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            font-size: 13px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.35);
        }

        .app-container {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top);
        }

        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Every interactive control clears the 44px minimum touch target. */
        .tap {
            min-height: 44px;
            min-width: 44px;
        }

        /* Leaflet ships mouse-sized controls; scale them up for fingers. */
        .leaflet-touch .leaflet-bar a,
        .leaflet-control-custom {
            width: 42px !important;
            height: 42px !important;
            line-height: 42px !important;
            font-size: 18px !important;
        }
        .leaflet-touch .leaflet-control-layers-toggle {
            width: 42px !important;
            height: 42px !important;
            background-size: 24px 24px !important;
        }
        .leaflet-control-layers-expanded {
            font-size: 14px;
            padding: 10px 12px;
            direction: rtl;
            text-align: right;
        }
        .leaflet-control-layers-expanded label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
        }
        .leaflet-popup-content-wrapper { border-radius: 14px; }
        .leaflet-popup-content {
            margin: 12px 14px;
            font-size: 13px;
            line-height: 1.5;
            max-width: 70vw;
        }
        /* Keep map controls out from under a notch */
        .leaflet-top { padding-top: env(safe-area-inset-top); }

        /* Phone in landscape: very little vertical room, so shave the chrome. */
        @media (orientation: landscape) and (max-height: 500px) {
            .landscape-tight { padding-top: 0.125rem; padding-bottom: 0.125rem; }
            .landscape-hide { display: none; }
        }

        /* Tablet and up: list and map side by side instead of tab-switched. */
        @media (min-width: 768px) {
            .leaflet-popup-content { max-width: 320px; font-size: 14px; }
        }

        /* Sign-in gate. Deliberately plain CSS rather than Tailwind classes: the gate is the first
           thing painted, and it has to look right even when the Tailwind CDN is slow or unreachable. */
        #authGate {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
            background: linear-gradient(160deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
            color: #fff;
            text-align: center;
        }
        /* Both of these are display:flex, so the hidden attribute alone would not hide them. */
        #authGate[hidden],
        .app-container[hidden] { display: none; }

        .gate-icon {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .gate-title { font-size: 20px; font-weight: 700; line-height: 1.4; }
        .gate-sub { font-size: 14px; opacity: 0.85; max-width: 22rem; line-height: 1.6; }
        /* Google renders its own button in here; it is LTR by design, so centre it explicitly. */
        #gsiButton { display: flex; justify-content: center; min-height: 44px; }
        .gate-msg {
            font-size: 14px;
            line-height: 1.6;
            max-width: 22rem;
            background: rgba(0, 0, 0, 0.22);
            border-radius: 14px;
            padding: 12px 16px;
        }
        .gate-msg b { word-break: break-all; }
        .gate-btn {
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            padding: 10px 22px;
            font: inherit;
            font-size: 14px;
            cursor: pointer;
        }
        .gate-btn:active { background: rgba(255, 255, 255, 0.28); }
        .gate-foot { font-size: 12px; opacity: 0.6; }

        /* Add-to-home-screen hint. Plain CSS, like the gate, so it still looks right on a
           cold Tailwind CDN. Floats over the tab bar instead of joining the flex column,
           so it cannot disturb the fixed-viewport layout. */
        #installHint {
            position: fixed;
            z-index: 90;
            right: 12px;
            left: 12px;
            bottom: calc(64px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 16px;
            background: #1e3a8a;
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
            font-size: 13px;
            line-height: 1.5;
        }
        #installHint[hidden] { display: none; }
        .install-icon { font-size: 18px; flex-shrink: 0; opacity: 0.9; }
        .install-text { flex: 1; }
        .install-btn {
            background: #fff;
            color: #1e3a8a;
            border: 0;
            border-radius: 999px;
            padding: 8px 14px;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }
        .install-btn:active { background: #dbeafe; }
        .install-close {
            background: none;
            border: 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            padding: 4px 6px;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- JavaScript Application Logic -->
    <script>
        // ─────────────────────────────────────────────────────────────────────────────
        // Sign-in gate
        //
        // Only Google accounts listed in users.txt can open the app. This is a lock on the
        // door, not a wall: everything here runs in the browser, so anyone willing to open
        // DevTools can walk past it, and users.txt is publicly readable once deployed.
        // It keeps strangers who find the URL out, and that is all it is meant to do.
        //
        // SETUP: paste the OAuth 2.0 client ID (Google Cloud Console → Credentials → Create
        // credentials → OAuth client ID → Web application) below. Every origin the app is
        // served from — http://localhost:8000 and the deploy URL — must be listed there under
        // "Authorized JavaScript origins". No redirect URIs are needed for the popup flow.
        const GOOGLE_CLIENT_ID = '361162593346-h8q1ohk8mrksuk5jn4vph2fpcqggjcku.apps.googleusercontent.com';

        const AUTH_STORAGE_KEY = 'tm_auth';
        let allowedEntries = null;  // Set of SHA-256 hashes, or null if users.txt was unreachable
        let appStarted = false;

        function readSession() {
            try { return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY)) || null; } catch (e) { return null; }
        }

        function saveSession(session) {
            try { localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session)); } catch (e) { /* private mode */ }
        }

        function clearSession() {
            try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (e) { /* private mode */ }
        }

        // users.txt is the source of truth for who gets in — one entry per line (commas and
        // # comments tolerated). Entries are SHA-256 hashes of the lowercased address, not the
        // address itself, so the family's email is not left sitting at a public URL. To change who
        // gets in, edit users.plain.txt (git-ignored) and re-run `python hash-users.py`.
        async function loadAllowlist() {
            const res = await fetch('users.txt', { cache: 'no-store' });
            if (!res.ok) throw new Error('users.txt returned ' + res.status);
            const entries = (await res.text())
                .split(/[\n,]/)
                .map(line => line.trim().toLowerCase())
                .filter(line => line && !line.startsWith('#'));
            if (!entries.length) throw new Error('users.txt is empty');
            return new Set(entries);
        }

        async function sha256Hex(text) {
            const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // A plain address in users.txt still works, so a hand-added line is never silently ignored.
        async function isAllowed(email) {
            if (!allowedEntries) return false;
            if (allowedEntries.has(email)) return true;
            return allowedEntries.has(await sha256Hex(email));
        }

        function gateMessage(html, withRetry) {
            const msg = document.getElementById('authMsg');
            msg.innerHTML = html;
            msg.hidden = false;
            document.getElementById('gsiButton').hidden = true;
            document.getElementById('authRetry').hidden = !withRetry;
        }

        // Loaded on demand rather than from <head>: a signed-in user opening the app with no
        // signal must not sit waiting on a request to accounts.google.com that cannot resolve.
        function loadGoogleScript() {
            return new Promise((resolve, reject) => {
                const el = document.createElement('script');
                el.src = 'https://accounts.google.com/gsi/client';
                el.async = true;
                el.onload = resolve;
                el.onerror = () => reject(new Error('failed to load Google Identity Services'));
                document.head.appendChild(el);
            });
        }

        // The ID token is a JWT; we read its payload without verifying the signature, which
        // would need a server. Given the gate is client-side anyway, that adds nothing real.
        function decodeJwtPayload(jwt) {
            try {
                const part = String(jwt).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                const padded = part + '='.repeat((4 - part.length % 4) % 4);
                const bytes = Uint8Array.from(atob(padded), c => c.charCodeAt(0));
                return JSON.parse(new TextDecoder('utf-8').decode(bytes));   // TextDecoder so Hebrew names survive
            } catch (e) {
                return null;
            }
        }

        async function onGoogleCredential(response) {
            const claims = decodeJwtPayload(response && response.credential);
            if (!claims || !claims.email) {
                gateMessage('לא הצלחנו לקרוא את פרטי החשבון. נסו שוב.', true);
                return;
            }

            const email = String(claims.email).trim().toLowerCase();
            if (claims.email_verified === false) {
                gateMessage('כתובת המייל של החשבון הזה לא אומתה מול Google.', true);
                return;
            }
            if (!await isAllowed(email)) {
                gateMessage('החשבון <b>' + email + '</b> אינו מורשה לצפות בטיול.', true);
                return;
            }

            saveSession({ email: email, name: claims.name || '', picture: claims.picture || '' });
            startApp();
        }

        async function showGate() {
            document.getElementById('authGate').hidden = false;

            // Opening the file directly blocks the users.txt fetch and is refused by Google
            // outright, so the "no connection" message below would send you chasing the wrong
            // problem. Name the real one.
            if (location.protocol === 'file:') {
                gateMessage('לא ניתן לפתוח את הקובץ ישירות — צריך להריץ שרת מקומי.<br>' +
                            'הריצו בתיקייה <b dir="ltr">python -m http.server 8000</b><br>' +
                            'ופתחו <b dir="ltr">http://localhost:8000/</b>', false);
                return;
            }

            // crypto.subtle (used to hash the address) only exists in a secure context, and Google
            // refuses to sign in outside one either. Serving over plain http from a LAN IP — a
            // phone hitting 192.168.x.x, say — lands here.
            if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
                gateMessage('הכניסה דורשת חיבור מאובטח.<br>פתחו את האפליקציה בכתובת <b dir="ltr">https</b> או דרך <b dir="ltr">localhost</b>.', false);
                return;
            }

            if (GOOGLE_CLIENT_ID.startsWith('PASTE_YOUR_CLIENT_ID_HERE')) {
                gateMessage('הכניסה עם Google עדיין לא הוגדרה.<br>יש להזין מזהה לקוח (Client ID) בקובץ index.html.', false);
                return;
            }

            // No allowlist means no way to tell who is allowed in, and no stored session to fall
            // back on — say so plainly instead of failing at the Google button a step later.
            if (!allowedEntries) {
                gateMessage('אין חיבור לאינטרנט, ולכן לא ניתן לאמת את הכניסה. התחברו לרשת ונסו שוב.', true);
                return;
            }

            try {
                await loadGoogleScript();
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: onGoogleCredential,
                    auto_select: false,
                    cancel_on_tap_outside: true
                });
                google.accounts.id.renderButton(document.getElementById('gsiButton'), {

        // State variables
        let currentDayIndex = 0;
        let map = null;
        let markersGroup = null;

        // Initialize Map
        function initMap() {
            map = L.map('map', {
                zoomControl: false 
            }).setView([42.0, -71.0], 6);

            L.control.zoom({ position: 'topleft' }).addTo(map);

            const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '© Google'
            });

            const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '© Google'
            });

            googleStreets.addTo(map);

            const baseMaps = {
                "מפה רגילה": googleStreets,
                "צילום אווירי": googleHybrid
            };
            L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

            const LocateControl = L.Control.extend({
                options: { position: 'topleft' },
                onAdd: function (map) {
                    const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
                    container.style.backgroundColor = 'white';
                    container.style.width = '34px';
                    container.style.height = '34px';
                    container.style.display = 'flex';
                    container.style.alignItems = 'center';
                    container.style.justifyContent = 'center';
                    container.style.cursor = 'pointer';
                    container.innerHTML = '<i class="fa-solid fa-crosshairs text-blue-600"></i>';
                    container.title = 'המיקום שלי';
                    
                    container.onclick = function(e){
                        e.stopPropagation();
                        map.locate({setView: true, maxZoom: 15});
                    }
                    return container;
                }
            });
            map.addControl(new LocateControl());

            let userLocationMarker = null;
            map.on('locationfound', function(e) {
                if (userLocationMarker) {
                    map.removeLayer(userLocationMarker);
                }
                userLocationMarker = L.circleMarker(e.latlng, {
                    radius: 8,
                    fillColor: "#3b82f6",
                    color: "#ffffff",
                    weight: 3,
                    opacity: 1,
                    fillOpacity: 0.9
                }).bindPopup('<div style="direction:rtl; text-align:right;"><b>המיקום שלך</b></div>').addTo(map);
            });

            map.on('locationerror', function(e) {
                alert("לא הצלחנו לאתר את המיקום שלך. ודא שה-GPS דלוק ושאישרת לדפדפן לגשת למיקום.");
            });

            markersGroup = L.layerGroup().addTo(map);

            currentDayIndex = indexForToday();
            buildDaysCarousel();
            updateUI();
            scrollToActiveButton('auto');

            // Fire-and-forget: the app is already rendered and interactive, and
            // refreshWeather() swallows its own failures.
            refreshWeather();
        }

        // One definition of the day-pill styling, used by both the initial build
        // and every re-render, so the two can never drift apart.
        function dayButtonClass(isActive) {
            return 'shrink-0 px-3.5 min-h-[40px] flex items-center rounded-full font-medium text-xs md:text-sm transition-all shadow-sm border '
                + (isActive
                    ? 'bg-blue-600 text-white border-blue-600'
                    : 'bg-white text-gray-600 border-gray-200 active:bg-gray-100');
        }

        // Which day the app opens on: today, if the trip is running; day 1 before it
        // starts; the last day once it is over. Dates are compared against the device's
        // local day rather than US Eastern - close enough for a family itinerary.
        function indexForToday() {
            const today = isoToday();
            let lastBefore = -1;
            for (let i = 0; i < itineraryData.length; i++) {
                const iso = dayToISODate(itineraryData[i]);
                if (!iso) continue;
                if (iso === today) return i;
                if (iso < today) lastBefore = i;
            }
            return lastBefore === -1 ? 0 : lastBefore;
        }

        // Build the top carousel with days
        function buildDaysCarousel() {
            const container = document.getElementById('daysCarousel');
            container.innerHTML = '';

            itineraryData.forEach((day, index) => {
                const btn = document.createElement('button');
                btn.className = dayButtonClass(index === currentDayIndex);
                btn.innerHTML = `יום ${day.dayId}`;
                btn.onclick = () => {
                    currentDayIndex = index;
                    updateUI();
                    btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                };
                container.appendChild(btn);
            });
        }

        // View Switcher (Tabs)
        function switchView(viewName, autoFit = true) {
            const tabList = document.getElementById('tabList');
            const tabMap = document.getElementById('tabMap');
            const timelineContainer = document.getElementById('timelineContainer');
            const mapContainer = document.getElementById('mapContainer');

            if (viewName === 'list') {
                timelineContainer.classList.remove('hidden');
                mapContainer.classList.add('hidden');
                
                tabList.classList.replace('text-gray-400', 'text-blue-600');
                tabMap.classList.replace('text-blue-600', 'text-gray-400');
            } else {
                timelineContainer.classList.add('hidden');
                mapContainer.classList.remove('hidden');
                
                tabMap.classList.replace('text-gray-400', 'text-blue-600');
                tabList.classList.replace('text-blue-600', 'text-gray-400');
                
                setTimeout(() => { 
                    map.invalidateSize(); 
                    if (autoFit) {
                        fitMapToCurrentDay();
                    }
                }, 50);
            }
        }

        function fitMapToCurrentDay() {
            const day = itineraryData[currentDayIndex];
            const bounds = [];
            day.stops.forEach(stop => bounds.push([stop.lat, stop.lng]));

            if (bounds.length > 0) {
                if (bounds.length === 1) {
                    map.setView(bounds[0], 12);
                } else {
                    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
                }
            }
        }

        // The only place weather reaches the DOM. updateUI() calls it as part of a
        // full render; the async refresh calls it alone, which is why it touches
        // nothing but these four nodes.
        function renderWeather() {
            const w = itineraryData[currentDayIndex].weather;
            // Marks the line when anything on it is still a hand-written estimate:
            // AQI runs out of real forecast days long before the temperatures do.
            const suffix = (w._live && w._liveAqi) ? '' : ' (הערכה)';

            document.getElementById('statWeatherTemp').innerText = `${w.max}°C / ${w.min}°C`;
            document.getElementById('statWeatherDesc').innerText = `${w.desc}, AQI: ${w.aqi}${suffix}`;
            document.getElementById('weatherIcon').className = `fa-solid ${w.icon}`;
            document.getElementById('weatherIconBg').className = `bg-${w.color}-100 text-${w.color}-500 rounded-full h-7 w-7 flex items-center justify-center text-xs shrink-0`;
        }

        // Core update function to reflect the current day's state
        function updateUI() {
            const day = itineraryData[currentDayIndex];
            
            // Update Carousel Buttons
            const buttons = document.getElementById('daysCarousel').children;
            for(let i = 0; i < buttons.length; i++) {
                buttons[i].className = dayButtonClass(i === currentDayIndex);
            }

            // Grey out the arrows at the ends of the trip
            document.getElementById('btnPrev').disabled = (currentDayIndex === 0);
            document.getElementById('btnNext').disabled = (currentDayIndex === itineraryData.length - 1);

            // Update Text Data
            document.getElementById('currentDayTitle').innerText = day.title;
            document.getElementById('currentDate').innerText = `${day.dayName}, ${day.date}`;
            document.getElementById('statDistance').innerText = day.driveDistance;
            document.getElementById('statTime').innerText = day.driveTime;
            
            // Update Weather Data
            renderWeather();

            // Update Timeline
            const timelineContainer = document.getElementById('timelineContent');
            timelineContainer.innerHTML = '';
            
            // Update Map Points
            markersGroup.clearLayers();

            day.stops.forEach((stop, index) => {
                // Timeline card
                const item = document.createElement('div');
                item.className = 'bg-white rounded-xl p-3 md:p-4 shadow-sm border border-gray-100 flex gap-2.5 md:gap-3 items-start transition-colors';
                
                item.innerHTML = `
                    <div class="bg-blue-100 text-blue-600 font-bold rounded-full w-7 h-7 md:w-8 md:h-8 flex items-center justify-center shrink-0 border border-blue-200 text-xs md:text-sm mt-0.5">
                        ${index + 1}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-gray-800 text-[15px] md:text-base mb-1 leading-snug">${stop.title}</h3>
                        <p class="text-[13px] md:text-sm text-gray-600 leading-relaxed">${stop.desc}</p>
                    </div>
                    <div class="flex flex-col gap-2 shrink-0">
                        <button class="bg-blue-50 text-blue-500 active:bg-blue-200 h-10 w-10 rounded-full flex justify-center items-center transition-colors" onclick="event.stopPropagation(); focusOnMap(${stop.lat}, ${stop.lng}, ${index})" aria-label="הצג במפה" title="הצג במפה">
                            <i class="fa-solid fa-location-crosshairs text-sm"></i>
                        </button>
                        <button class="bg-emerald-50 text-emerald-500 active:bg-emerald-200 h-10 w-10 rounded-full flex justify-center items-center transition-colors" onclick="event.stopPropagation(); window.open('https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}', '_blank')" aria-label="נווט ליעד" title="נווט ליעד">
                            <i class="fa-solid fa-diamond-turn-right text-sm"></i>
                        </button>
                    </div>
                `;
                timelineContainer.appendChild(item);

                // Map Marker
                const iconHtml = `<div class="custom-marker">${index + 1}</div>`;
                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([stop.lat, stop.lng], { icon: customIcon })
                    .bindPopup(`<div style="direction:rtl; text-align:right;"><b>${stop.title}</b><br><span style="font-size:11px;">${stop.desc}</span></div>`)
                    .addTo(markersGroup);
                
                stop._marker = marker;
            });

            // Adjust Map view bounds
            fitMapToCurrentDay();
        }

        function nextDay() {
            if (currentDayIndex < itineraryData.length - 1) {
                currentDayIndex++;
                updateUI();
                scrollToActiveButton();
            }
        }

        function prevDay() {
            if (currentDayIndex > 0) {
                currentDayIndex--;
                updateUI();
                scrollToActiveButton();
            }
        }

        function scrollToActiveButton(behavior) {
            const buttons = document.getElementById('daysCarousel').children;
            if (buttons[currentDayIndex]) {
                buttons[currentDayIndex].scrollIntoView({ behavior: behavior || 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        function focusOnMap(lat, lng, stopIndex) {
            // First, switch to the map tab automatically without auto-fitting
            switchView('map', false);
            
            // Fly to location
            map.flyTo([lat, lng], 15, {
                animate: true,
                duration: 1.2
            });

            // Open the marker popup
            const day = itineraryData[currentDayIndex];
            if (day.stops[stopIndex] && day.stops[stopIndex]._marker) {
                setTimeout(() => {
                    day.stops[stopIndex]._marker.openPopup();
                }, 1000); 
            }
        }

        // Swipe left/right on the itinerary to move between days.
        // RTL: later days sit to the left, so dragging content rightwards
        // brings the next day in - matching the chevron directions in the nav.
        function enableSwipeNavigation() {
            const el = document.getElementById('timelineContainer');
            let startX = 0, startY = 0, tracking = false;

            el.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) { tracking = false; return; }
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                tracking = true;
            }, { passive: true });

            el.addEventListener('touchend', (e) => {
                if (!tracking) return;
                tracking = false;

                const dx = e.changedTouches[0].clientX - startX;
                const dy = e.changedTouches[0].clientY - startY;

                // Only act on a clearly horizontal flick, so vertical scrolling wins ties
                if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;

                if (dx > 0) {
                    nextDay();
                } else {
                    prevDay();
                }
            }, { passive: true });
        }

        // Rotating the device or crossing the tablet breakpoint changes the map's
        // box, so Leaflet has to be told. Note that plain 'resize' also fires on
        // phones every time the URL bar collapses - so that path only re-measures
        // and must never re-fit, or it would snap away a pan the user is mid-way
        // through. Re-fitting is reserved for a real layout change.
        function handleViewportChange() {
            let pending;
            const refresh = (refit) => {
                clearTimeout(pending);
                pending = setTimeout(() => {
                    if (!map) return;
                    map.invalidateSize();
                    if (refit) fitMapToCurrentDay();
                }, 150);
            };

            window.addEventListener('resize', () => refresh(false));
            window.addEventListener('orientationchange', () => refresh(true));

            const wide = window.matchMedia('(min-width: 768px)');
            const onBreakpoint = () => refresh(true);
            if (wide.addEventListener) {
                wide.addEventListener('change', onBreakpoint);
            } else {
                wide.addListener(onBreakpoint); // older iOS Safari
            }
        }

        // ---------------------------------------------------------------
        // Live weather (Open-Meteo — no API key, HTTPS, CORS-open)
        //
        // Cost is deliberately tiny: the API takes comma-separated coordinate
        // lists, so the ENTIRE trip is two requests, not one per day — and
        // near-identical stops (the five Manhattan days) collapse to a single
        // location first. It is fired after the first render and never awaited,
        // so it cannot delay paint or input. A three-hour localStorage cache
        // means a relaunch inside that window makes no network call at all.
        //
        // The hardcoded values in itineraryData remain the fallback: offline,
        // request failure, or a date past the forecast horizon all just leave
        // them in place.
        // ---------------------------------------------------------------
        const WEATHER_CACHE_KEY = 'tm_weather_v1';
        const WEATHER_CACHE_TTL_MS = 3 * 60 * 60 * 1000;  // 3 hours
        const WEATHER_TIMEOUT_MS = 8000;
        const TRIP_TZ = 'America/New_York';
        const FORECAST_HORIZON_DAYS = 15;  // Open-Meteo daily forecast limit (16 incl. today)
        const AQI_HORIZON_DAYS = 6;        // air-quality forecast limit (7 incl. today)

        // WMO weather code -> Hebrew label, Font Awesome icon, palette color.
        // Colors are restricted to sky / amber / gray on purpose: those classes
        // are interpolated at runtime (bg-${color}-100), which only works for
        // names the Tailwind Play CDN has already seen in the markup.
        function weatherFromCode(code) {
            if (code === 0)                 return { desc: "שמיים נקיים", icon: "fa-sun", color: "amber" };
            if (code === 1)                 return { desc: "בהיר בעיקרו", icon: "fa-sun", color: "amber" };
            if (code === 2)                 return { desc: "מעונן חלקית", icon: "fa-cloud-sun", color: "sky" };
            if (code === 3)                 return { desc: "עננים", icon: "fa-cloud", color: "gray" };
            if (code === 45 || code === 48) return { desc: "ערפל", icon: "fa-smog", color: "gray" };
            if (code >= 51 && code <= 57)   return { desc: "טפטוף", icon: "fa-cloud-rain", color: "sky" };
            if (code >= 61 && code <= 65)   return { desc: "גשם", icon: "fa-cloud-showers-heavy", color: "sky" };
            if (code === 66 || code === 67) return { desc: "גשם קפוא", icon: "fa-cloud-rain", color: "sky" };
            if (code >= 71 && code <= 77)   return { desc: "שלג", icon: "fa-snowflake", color: "gray" };
            if (code >= 80 && code <= 82)   return { desc: "ממטרים", icon: "fa-cloud-showers-heavy", color: "sky" };
            if (code === 85 || code === 86) return { desc: "ממטרי שלג", icon: "fa-snowflake", color: "gray" };
            if (code >= 95)                 return { desc: "סופות רעמים", icon: "fa-cloud-bolt", color: "gray" };
            return { desc: "מזג אוויר משתנה", icon: "fa-cloud-sun", color: "sky" };
        }

        // "10/9/26" (D/M/YY) -> "2026-09-10". The API speaks ISO only.
        function dayToISODate(day) {
            const parts = String(day.date).split('/');
            if (parts.length !== 3) return null;
            const d = Number(parts[0]), m = Number(parts[1]), y = 2000 + Number(parts[2]);
            if (!d || !m || !y) return null;
            return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        }

        function isoToday(offsetDays) {
            const t = new Date();
            t.setDate(t.getDate() + (offsetDays || 0));
            return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
        }

        // Fetch with a hard deadline, so a roaming dead-zone can never leave a
        // request hanging around holding a connection open.
        async function fetchWithTimeout(url) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), WEATHER_TIMEOUT_MS);
            try {
                const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        // Multi-location responses come back as an array, single-location as a
        // bare object. Normalise so the merge code has one shape to handle.
        function asLocationList(json) {
            return Array.isArray(json) ? json : [json];
        }

        // Copy live values onto the day objects. Marked _live so renderWeather()
        // can tell a real forecast from the hand-written estimate.
        function applyWeather(byDayId) {
            let applied = 0;
            itineraryData.forEach(day => {
                const live = byDayId[day.dayId];
                if (!live) return;
                Object.assign(day.weather, live, { _live: true });
                applied++;
            });
            return applied;
        }

        function readWeatherCache() {
            try {
                const raw = localStorage.getItem(WEATHER_CACHE_KEY);
                if (!raw) return null;
                const cached = JSON.parse(raw);
                if (!cached || !cached.ts || !cached.byDayId) return null;
                if (Date.now() - cached.ts > WEATHER_CACHE_TTL_MS) return null;
                return cached.byDayId;
            } catch (e) {
                return null;
            }
        }

        async function refreshWeather() {
            // Synchronous, same tick as the first render: a warm cache paints
            // live numbers with no flash of the hardcoded ones and no network.
            const cached = readWeatherCache();
            if (cached) {
                applyWeather(cached);
                renderWeather();
                return;
            }

            // Only days that actually fall inside the forecast horizon are worth
            // asking about — anything further out the API cannot answer.
            const from = isoToday(0);
            const forecastTo = isoToday(FORECAST_HORIZON_DAYS);
            const aqiTo = isoToday(AQI_HORIZON_DAYS);

            const wanted = [];
            itineraryData.forEach(day => {
                const iso = dayToISODate(day);
                if (!iso || iso < from || iso > forecastTo) return;
                const stop = day.stops && day.stops[0];
                if (!stop || typeof stop.lat !== 'number' || typeof stop.lng !== 'number') return;
                wanted.push({ day: day, iso: iso, lat: stop.lat, lng: stop.lng });
            });
            if (!wanted.length) return;

            // Collapse coordinates to ~1 km precision. The Manhattan block and
            // any repeated overnight base become one location in the request.
            const locIndexByKey = {};
            const lats = [], lngs = [];
            wanted.forEach(entry => {
                const key = entry.lat.toFixed(2) + ',' + entry.lng.toFixed(2);
                if (!(key in locIndexByKey)) {
                    locIndexByKey[key] = lats.length;
                    lats.push(entry.lat.toFixed(4));
                    lngs.push(entry.lng.toFixed(4));
                }
                entry.locIndex = locIndexByKey[key];
            });

            const coords = 'latitude=' + lats.join(',') + '&longitude=' + lngs.join(',');
            const forecastUrl = 'https://api.open-meteo.com/v1/forecast?' + coords
                + '&daily=weather_code,temperature_2m_max,temperature_2m_min'
                + '&timezone=' + encodeURIComponent(TRIP_TZ)
                + '&start_date=' + from + '&end_date=' + forecastTo;
            const aqiUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?' + coords
                + '&hourly=us_aqi'
                + '&timezone=' + encodeURIComponent(TRIP_TZ)
                + '&start_date=' + from + '&end_date=' + aqiTo;

            // AQI is the softer of the two: if it fails, temperatures still land.
            const results = await Promise.allSettled([
                fetchWithTimeout(forecastUrl),
                fetchWithTimeout(aqiUrl)
            ]);
            const forecastRes = results[0], aqiRes = results[1];

            if (forecastRes.status !== 'fulfilled') return;  // keep the estimates

            const locs = asLocationList(forecastRes.value);

            // AQI at local midday, per location, as { "2026-09-10": 42 }.
            const aqiByLoc = [];
            if (aqiRes.status === 'fulfilled') {
                asLocationList(aqiRes.value).forEach((loc, i) => {
                    const times = loc && loc.hourly && loc.hourly.time;
                    const values = loc && loc.hourly && loc.hourly.us_aqi;
                    if (!times || !values) return;
                    const byDate = {};
                    for (let h = 0; h < times.length; h++) {
                        if (times[h].slice(-6) === 'T12:00' && values[h] != null) {
                            byDate[times[h].slice(0, 10)] = Math.round(values[h]);
                        }
                    }
                    aqiByLoc[i] = byDate;
                });
            }

            const byDayId = {};
            wanted.forEach(entry => {
                const loc = locs[entry.locIndex];
                const daily = loc && loc.daily;
                if (!daily || !daily.time) return;

                const i = daily.time.indexOf(entry.iso);
                if (i === -1) return;

                const max = daily.temperature_2m_max[i];
                const min = daily.temperature_2m_min[i];
                if (max == null || min == null) return;

                const look = weatherFromCode(daily.weather_code[i]);
                const locAqi = aqiByLoc[entry.locIndex];
                const aqi = locAqi ? locAqi[entry.iso] : null;

                byDayId[entry.day.dayId] = {
                    max: Math.round(max),
                    min: Math.round(min),
                    desc: look.desc,
                    icon: look.icon,
                    color: look.color,
                    aqi: (aqi != null) ? aqi : entry.day.weather.aqi,
                    _liveAqi: (aqi != null)
                };
            });

            if (!applyWeather(byDayId)) return;

            try {
                localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ ts: Date.now(), byDayId: byDayId }));
            } catch (e) {
                // Storage full or blocked — the data is live for this session anyway.
            }

            // Only the four header nodes are repainted. Deliberately NOT a full
            // updateUI(): that would clear and rebuild every marker, invalidate
            // the stop._marker references, close an open popup and refit the map
            // — a visible jolt if this lands while the user is panning around.
            renderWeather();
        }

        // ─────────────────────────────────────────────────────────────────────────────
        // Add to home screen
        //
        // manifest.json does the real work — this is discovery only, so nobody has to know
        // to go hunting through a browser menu. Two very different platforms:
        //
        //   Android/Chrome fires beforeinstallprompt when the app qualifies for install.
        //   We swallow Chrome's own mini-infobar and keep the event, so tapping "התקנה"
        //   installs a real WebAPK — its own icon, its own app-drawer entry, no address bar.
        //
        //   iOS never fires that event. Share → "הוספה למסך הבית" in Safari is the only
        //   route, so all we can do is say so.
        //
        // Either way it appears once and is remembered as dismissed. It lives inside
        // .app-container, so the gate hides it for anyone who has not signed in yet.

        const INSTALL_HINT_KEY = 'tm_install_hint_v1';
        let deferredInstallPrompt = null;

        function isStandalone() {
            return window.matchMedia('(display-mode: standalone)').matches ||
                   window.navigator.standalone === true;   // iOS
        }

        function installHintDismissed() {
            try { return localStorage.getItem(INSTALL_HINT_KEY) === 'done'; } catch (e) { return false; }
        }

        function dismissInstallHint() {
            try { localStorage.setItem(INSTALL_HINT_KEY, 'done'); } catch (e) { /* private mode */ }
            document.getElementById('installHint').hidden = true;
        }

        function showInstallHint(html, withButton) {
            if (!appStarted || isStandalone() || installHintDismissed()) return;
            document.getElementById('installHintText').innerHTML = html;
            document.getElementById('installHintBtn').hidden = !withButton;
            document.getElementById('installHint').hidden = false;
        }

        async function runInstallPrompt() {
            if (!deferredInstallPrompt) return;
            const promptEvent = deferredInstallPrompt;
            deferredInstallPrompt = null;   // the event is single-use
            promptEvent.prompt();
            await promptEvent.userChoice;
            dismissInstallHint();
        }

        function maybeShowInstallHint() {
            if (deferredInstallPrompt) {
                showInstallHint('רוצים גישה מהירה? הוסיפו את האפליקציה למסך הבית.', true);
                return;
            }

            // Only real Safari on iOS can add to the home screen. Chrome/Firefox on iOS and
            // in-app browsers (Facebook, Instagram, WhatsApp) cannot, and instructions that
            // lead nowhere are worse than no hint at all.
            const ua = navigator.userAgent;
            const isIos = /iPad|iPhone|iPod/.test(ua) ||
                          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const isSafari = /Safari/.test(ua) &&
                             !/CriOS|FxiOS|EdgiOS|OPiOS|FBAN|FBAV|Instagram|Line|MicroMessenger/.test(ua);
            if (isIos && isSafari) {
                showInstallHint('להוספה למסך הבית: הקישו על כפתור השיתוף ' +
                                '<i class="fa-solid fa-arrow-up-from-bracket"></i> ' +
                                'ואז על ״הוספה למסך הבית״.', false);
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();          // suppress Chrome's own banner; we ask in-app instead
            deferredInstallPrompt = e;
            maybeShowInstallHint();      // no-op until startApp() has run
        });

        window.addEventListener('appinstalled', dismissInstallHint);

        // Initialize App — the gate decides when startApp() runs.
        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
        });

    </script>
</body>
</html>
